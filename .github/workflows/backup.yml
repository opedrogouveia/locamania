# Backup diário do banco de produção (§36).
#
# Roda no GitHub Actions (não depende da API acordada). O arquivo fica como
# artefato do workflow por 30 dias; o Supabase ainda guarda os backups dele.
#
# Configuração (uma vez) — Settings → Secrets and variables → Actions:
#   DATABASE_URL_BACKUP = conexão de SESSÃO do Supabase (porta 5432), não a do pooler 6543.
name: Backup do banco

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília — fora do horário de operação.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o cliente do PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Gerar o dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: ./scripts/backup-db.sh ./backups
      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: locamania-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error
