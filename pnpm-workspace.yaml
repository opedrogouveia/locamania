packages:
  - backend
  - frontend
  - packages/*
# O pnpm 11 exige aprovar scripts de build de dependências.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@parcel/watcher': false
  '@nestjs/core': true
  argon2: true
  prisma: true
  sharp: true
  unrs-resolver: true
